        <rect x="14" y="0" width="10" height="10" rx="2"/><rect x="14" y="14" width="10" height="10" rx="2"/><rect x="14" y="28" width="10" height="10" rx="2"/><rect x="14" y="42" width="10" height="10" rx="2"/><rect x="14" y="56" width="10" height="10" rx="2"/>
        <rect x="28" y="0" width="10" height="10" rx="2"/><rect x="28" y="14" width="10" height="10" rx="2"/><rect x="28" y="28" width="10" height="10" rx="2"/><rect x="28" y="42" width="10" height="10" rx="2"/><rect x="28" y="56" width="10" height="10" rx="2"/>
      </g>
      <g fill="#d5e4ff">
        <rect x="42" y="14" width="10" height="10" rx="2"/><rect x="42" y="28" width="10" height="10" rx="2"/><rect x="56" y="0" width="10" height="10" rx="2"/><rect x="56" y="42" width="10" height="10" rx="2"/><rect x="70" y="28" width="10" height="10" rx="2"/><rect x="84" y="14" width="10" height="10" rx="2"/><rect x="84" y="56" width="10" height="10" rx="2"/>
      </g>
