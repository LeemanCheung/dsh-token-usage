    <text x="296" y="128" fill="#79839a" font-size="13">持久化统计模型请求与上下文压缩用量</text>
    <g>
      <rect x="296" y="160" width="152" height="89" rx="12" fill="#f4f7fc" stroke="#e5eaf3"/>
      <text x="312" y="185" fill="#778198" font-size="11">总 Token</text>
      <text x="312" y="222" fill="#17233f" font-size="25" font-weight="700">208.3M</text>
      <rect x="462" y="160" width="152" height="89" rx="12" fill="#f4f7fc" stroke="#e5eaf3"/>
      <text x="478" y="185" fill="#778198" font-size="11">输入 Token</text>
      <text x="478" y="222" fill="#17233f" font-size="25" font-weight="700">200M</text>
      <rect x="628" y="160" width="152" height="89" rx="12" fill="#f4f7fc" stroke="#e5eaf3"/>
      <text x="644" y="185" fill="#778198" font-size="11">输出 Token</text>
      <text x="644" y="222" fill="#17233f" font-size="25" font-weight="700">8.3M</text>
      <rect x="794" y="160" width="152" height="89" rx="12" fill="#f4f7fc" stroke="#e5eaf3"/>
      <text x="810" y="185" fill="#778198" font-size="11">缓存命中率</text>
      <text x="810" y="222" fill="#17233f" font-size="25" font-weight="700">92%</text>
