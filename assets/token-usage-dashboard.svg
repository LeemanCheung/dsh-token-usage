<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">dsh-token-usage dashboard illustration</title>
  <desc id="desc">A Token usage dashboard with metric cards, a 52-week activity heatmap, model usage and session records.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6cff"/>
      <stop offset="1" stop-color="#775cf6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#304878" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#page)"/>
  <circle cx="1090" cy="42" r="180" fill="#dce6ff" opacity=".65"/>
  <circle cx="80" cy="640" r="150" fill="#e8ddff" opacity=".55"/>
  <g filter="url(#shadow)">
    <rect x="58" y="52" width="1084" height="576" rx="20" fill="#ffffff"/>
  </g>
  <rect x="58" y="52" width="198" height="576" rx="20" fill="#171c2b"/>
  <rect x="58" y="164" width="198" height="52" fill="#273557"/>
  <rect x="58" y="164" width="4" height="52" fill="#75a6ff"/>
  <text x="84" y="104" fill="#ffffff" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700">DSH</text>
  <text x="84" y="129" fill="#aab6d4" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12">Settings</text>
  <text x="84" y="196" fill="#ffffff" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700">Token 用量</text>
  <text x="84" y="250" fill="#aab6d4" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14">常规</text>
  <text x="84" y="294" fill="#aab6d4" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14">模型与提供方</text>
  <text x="84" y="338" fill="#aab6d4" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14">工作区</text>
  <text x="84" y="382" fill="#aab6d4" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14">关于 DSH</text>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
