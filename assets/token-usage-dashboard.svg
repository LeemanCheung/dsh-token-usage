      </g>
      <g fill="#edf1f7"><rect x="462" y="0" width="10" height="10" rx="2"/><rect x="462" y="14" width="10" height="10" rx="2"/><rect x="462" y="28" width="10" height="10" rx="2"/><rect x="476" y="42" width="10" height="10" rx="2"/><rect x="490" y="56" width="10" height="10" rx="2"/></g>
    </g>
    <text x="1005" y="404" fill="#79839a" font-size="10">少</text><rect x="1025" y="395" width="10" height="10" rx="2" fill="#edf1f7"/><rect x="1040" y="395" width="10" height="10" rx="2" fill="#d5e4ff"/><rect x="1055" y="395" width="10" height="10" rx="2" fill="#8db6ff"/><rect x="1070" y="395" width="10" height="10" rx="2" fill="#2f6cff"/><text x="1090" y="404" fill="#79839a" font-size="10">多</text>
    <rect x="296" y="460" width="500" height="140" rx="14" fill="#ffffff" stroke="#e5eaf3"/>
    <text x="316" y="491" fill="#17233f" font-size="15" font-weight="700">模型用量</text>
    <text x="316" y="518" fill="#79839a" font-size="11">提供方 / 模型</text><text x="619" y="518" fill="#79839a" font-size="11">总量</text><text x="710" y="518" fill="#79839a" font-size="11">输出</text>
    <line x1="316" y1="530" x2="776" y2="530" stroke="#edf1f7"/>
    <text x="316" y="554" fill="#17233f" font-size="12" font-weight="700">deepseek-chat</text><text x="316" y="571" fill="#79839a" font-size="10">deepseek</text><text x="619" y="557" fill="#17233f" font-size="12">100.4M</text><text x="710" y="557" fill="#17233f" font-size="12">4.2M</text>
    <line x1="316" y1="581" x2="776" y2="581" stroke="#edf1f7"/>
    <text x="316" y="599" fill="#17233f" font-size="12" font-weight="700">deepseek-reasoner</text><text x="619" y="599" fill="#17233f" font-size="12">79.7M</text><text x="710" y="599" fill="#17233f" font-size="12">3.8M</text>
    <rect x="816" y="460" width="296" height="140" rx="14" fill="url(#accent)"/>
    <text x="840" y="498" fill="#ffffff" font-size="15" font-weight="700">隐私优先</text>
    <text x="840" y="526" fill="#e8efff" font-size="12">只统计 Token bucket</text>
    <text x="840" y="548" fill="#e8efff" font-size="12">不保存提示词或回复正文</text>
    <path d="M1045 551 l12 12 l25 -31" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
