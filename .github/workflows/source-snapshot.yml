name: Offline source snapshot
on:
  push:
    branches: [feat/workbench-completion-v050]
    paths: [.github/workflows/source-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2d73b2b088e4f69114445a441de13113b221ad4c
      - run: git archive --format=tar.gz --output="$RUNNER_TEMP/dsh-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-source-040
          path: ${{ runner.temp }}/dsh-source.tar.gz
          retention-days: 1
