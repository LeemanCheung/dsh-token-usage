name: Workbench failure diagnostics
on:
  push:
    branches: [feat/local-usage-workbench]
    paths: [.github/workflows/workbench-diagnostics.yml]
permissions:
  contents: write
  actions: read
jobs:
  diagnostics:
    if: github.repository == 'LeemanCheung/dsh-token-usage'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Extract typecheck failure only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const response = await fetch('https://api.github.com/repos/LeemanCheung/dsh-token-usage/actions/jobs/103215057282/logs', { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' }});
          if (!response.ok) throw new Error(`Logs HTTP ${response.status}`);
          const text = (await response.text()).replace(/\x1b\[[0-9;]*m/g, '');
          const start = text.indexOf('> typecheck');
          const end = text.indexOf('##[group]Run actions/upload-artifact', start);
          const errors = text.slice(start < 0 ? -10000 : start, end > start ? end : undefined).split('\n').filter(line => /error TS|Error:|src\/|tests\/|typecheck|error during|Process completed/.test(line)).join('\n').slice(0, 12000);
          writeFileSync('.candidate/diagnostics.txt', `Source job: 103215057282\n${errors}\n`);
          NODE
      - name: Persist bounded diagnostic on the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .candidate/diagnostics.txt
          git diff --cached --quiet || git commit -m 'ci: record candidate typecheck diagnostics'
          git push origin HEAD:refs/heads/feat/local-usage-workbench
