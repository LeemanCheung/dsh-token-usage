name: Repair PR branch

on:
  push:
    branches:
      - feat/token-usage-high-value-insights
    paths:
      - .github/workflows/repair-pr.yml

permissions:
  contents: write

env:
  DSH_REF: fb82698709c39f1860b0ab0ed147e1fa30c1d5d0
  DSH_VERSION: 0.1.0-rc.6
  DSH_PNPM_VERSION: 11.7.0

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/token-usage-high-value-insights
          fetch-depth: 0

      - name: Use Node.js 22.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Apply reviewed fixes and regression tests
        run: |
          node --check scripts/repair-pr.mjs
          node scripts/repair-pr.mjs

      - name: Bootstrap pinned DeepSeek Harness toolchain
        shell: bash
        run: |
          set -euo pipefail
          harness="$RUNNER_TEMP/deepseek-harness"
          git init "$harness"
          git -C "$harness" remote add origin https://github.com/deepseek-ai/deepseek-harness.git
          git -C "$harness" fetch --depth 1 origin "$DSH_REF"
          git -C "$harness" checkout --detach FETCH_HEAD
          corepack enable
          corepack prepare "pnpm@$DSH_PNPM_VERSION" --activate
          pnpm --dir "$harness" install --frozen-lockfile --ignore-scripts
          ln -sfn "$harness" "$GITHUB_WORKSPACE/../deepseek-harness"

          node <<'NODE' > "$RUNNER_TEMP/plugin-dependencies.txt"
          const { readFileSync } = require('node:fs')
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'))
          const dependencies = Object.entries(manifest.peerDependencies).map(([name, range]) =>
            name.startsWith('@deepseek-ai/dsh-')
              ? `${name}@${process.env.DSH_VERSION}`
              : `${name}@${range}`)
          dependencies.push(
            '@testing-library/react@16.3.2',
            '@types/node@22.20.0',
            '@types/react@~18.3.1',
            '@types/react-dom@~18.3.0',
            'jsdom@29.1.1',
            'react-dom@18.3.1',
            'typescript@6.0.3',
            'vitest@4.1.8',
            'tsdown@0.22.2',
          )
          process.stdout.write(`${dependencies.join('\n')}\n`)
          NODE
          mapfile -t plugin_dependencies < "$RUNNER_TEMP/plugin-dependencies.txt"
          npm install --ignore-scripts --no-save --package-lock=false "${plugin_dependencies[@]}"
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Validate repaired source
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          npm run build
          git diff --check
          npm pack --dry-run --json | tee "$RUNNER_TEMP/npm-pack.json"

      - name: Commit repaired source, tests, docs, and bundles
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/repair-pr.mjs
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: harden route accounting and add CI"
          git push origin "HEAD:${GITHUB_REF_NAME}"
