name: Workbench completion candidate
on:
  push:
    branches: [feat/workbench-completion-v050]
    paths: [.verification/ready]
permissions:
  contents: write
concurrency:
  group: workbench-completion-candidate
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'LeemanCheung/dsh-token-usage' && github.ref == 'refs/heads/feat/workbench-completion-v050'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Apply hash-verified source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/workbench
          node .verification/apply.mjs 2>&1 | tee test-results/workbench/source.log
      - uses: actions/cache/restore@v4
        id: toolchain
        with:
          path: ${{ runner.temp }}/deepseek-harness
          key: workbench-dsh-a66e470-node22-pnpm11-v2
      - name: Build pinned DSH if absent
        if: steps.toolchain.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          harness="$RUNNER_TEMP/deepseek-harness"
          git init "$harness"
          git -C "$harness" remote add origin https://github.com/deepseek-ai/deepseek-harness.git
          git -C "$harness" fetch --depth 1 origin a66e4702047846cdaa10c66c9d3df3951f5ea70d
          git -C "$harness" checkout --detach FETCH_HEAD
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm --dir "$harness" install --frozen-lockfile --ignore-scripts
          pnpm --dir "$harness" run build:lib
      - name: Link fixed dependencies
        run: |
          ln -sfn "$RUNNER_TEMP/deepseek-harness" "$GITHUB_WORKSPACE/../deepseek-harness"
          node scripts/link-dsh-workspace.mjs "$RUNNER_TEMP/deepseek-harness" "$GITHUB_WORKSPACE/node_modules"
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck 2>&1 | tee test-results/workbench/typecheck.log
      - name: All regression tests
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee test-results/workbench/unit-tests.log
      - name: Actual React and Host browser workflows
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run-workbench-e2e.sh 2>&1 | tee test-results/workbench/browser.log
      - name: Deterministic installable bundles and package check
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee test-results/workbench/build.log
          sha256sum lib/client.js lib/client.js.map lib/index.js > test-results/workbench/bundle-sha256.txt
          npm run build
          sha256sum --check test-results/workbench/bundle-sha256.txt
          git diff --check
          npm pack --dry-run --json > test-results/workbench/package-manifest.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const pack=JSON.parse(readFileSync('test-results/workbench/package-manifest.json','utf8'))[0];
          if(pack.version!=='0.5.0') throw Error('Wrong package version');
          const paths=pack.files.map(file=>file.path);
          for(const path of ['docs/workbench-acceptance.md','src/workbench/scenarios.ts','src/workbench/price-history.ts','src/client/selectors/usage.ts','lib/index.js','lib/client.js','lib/client.js.map']) if(!paths.includes(path)) throw Error(`Missing ${path}`);
          const exact=new Set(['LICENSE','README.md','package.json','cordis.patch.yml','docs/workbench.md','docs/workbench-acceptance.md','docs/compatibility-0.1.2-rc.1.md']);
          if(paths.some(path=>!exact.has(path)&&!['src/','lib/','assets/'].some(prefix=>path.startsWith(prefix)))) throw Error('Unexpected package contents');
          console.log(`Validated ${paths.length} packaged files`);
          NODE
      - name: Commit verified source and bundles to candidate only
        shell: bash
        run: |
          set -euo pipefail
          remote=$(git ls-remote origin refs/heads/feat/workbench-completion-v050 | cut -f1)
          test "$remote" = "$GITHUB_SHA" || { echo 'Source changed during verification; no files pushed'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests scripts docs package.json README.md CHANGELOG.md lib
          git diff --cached --quiet || git commit -m 'build: verify completion requirements and regenerate 0.5.0 bundles'
          git push origin HEAD:refs/heads/feat/workbench-completion-v050
      - name: Verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workbench-completion-evidence
          path: test-results/workbench
          retention-days: 14
          if-no-files-found: error
