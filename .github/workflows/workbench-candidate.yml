name: Workbench candidate verification
on:
  push:
    branches: [feat/local-usage-workbench]
    paths: [.candidate/ready]
permissions:
  contents: write
concurrency:
  group: workbench-candidate
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'LeemanCheung/dsh-token-usage' && github.ref == 'refs/heads/feat/local-usage-workbench'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Apply reviewed integration patches
        run: |
          node .candidate/integrate.mjs
          node .candidate/finalize.mjs
          node .candidate/ui-fixes.mjs
          node .candidate/assert-integration.mjs
      - uses: actions/cache/restore@v4
        id: toolchain
        with:
          path: ${{ runner.temp }}/deepseek-harness
          key: workbench-dsh-a66e470-node22-pnpm11-v2
      - name: Build pinned DSH toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          harness="$RUNNER_TEMP/deepseek-harness"
          git init "$harness"
          git -C "$harness" remote add origin https://github.com/deepseek-ai/deepseek-harness.git
          git -C "$harness" fetch --depth 1 origin a66e4702047846cdaa10c66c9d3df3951f5ea70d
          git -C "$harness" checkout --detach FETCH_HEAD
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm --dir "$harness" install --frozen-lockfile --ignore-scripts
          pnpm --dir "$harness" run build:lib
      - uses: actions/cache/save@v4
        if: steps.toolchain.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/deepseek-harness
          key: workbench-dsh-a66e470-node22-pnpm11-v2
      - name: Link pinned dependencies
        run: |
          ln -sfn "$RUNNER_TEMP/deepseek-harness" "$GITHUB_WORKSPACE/../deepseek-harness"
          node scripts/link-dsh-workspace.mjs "$RUNNER_TEMP/deepseek-harness" "$GITHUB_WORKSPACE/node_modules"
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          mkdir -p test-results/workbench
      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck 2>&1 | tee test-results/workbench/typecheck.log
      - name: Regression tests
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee test-results/workbench/unit-tests.log
      - name: Browser and Host integration
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run-workbench-e2e.sh 2>&1 | tee test-results/workbench/browser.log
      - name: Rebuild deterministic installable bundles
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee test-results/workbench/build.log
          sha256sum lib/client.js lib/client.js.map lib/index.js > test-results/workbench/bundle-sha256.txt
          npm run build 2>&1 | tee -a test-results/workbench/build.log
          sha256sum --check test-results/workbench/bundle-sha256.txt
          git diff --check
          npm pack --dry-run --json > test-results/workbench/package-manifest.json
      - name: Commit verified generated source and bundles on this feature branch only
        shell: bash
        run: |
          set -euo pipefail
          remote=$(git ls-remote origin refs/heads/feat/local-usage-workbench | cut -f1)
          if test "$remote" != "$GITHUB_SHA"; then
            echo 'Candidate source changed during verification; no generated files published.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Workflow edits are committed separately through the maintainer connection.
          # This token needs only contents:write, not workflows permission.
          git add src tests scripts package.json README.md lib
          if ! git diff --cached --quiet; then
            git commit -m 'build: verify workbench integration and regenerate deterministic bundles'
            git push origin HEAD:refs/heads/feat/local-usage-workbench
          fi
      - name: Persist bounded failure evidence
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          remote=$(git ls-remote origin refs/heads/feat/local-usage-workbench | cut -f1)
          test "$remote" = "$GITHUB_SHA" || exit 0
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, writeFileSync } from 'node:fs';
          const output = [`Run: ${process.env.GITHUB_RUN_ID}; source: ${process.env.GITHUB_SHA}`];
          for (const file of ['typecheck.log', 'unit-tests.log', 'browser.log', 'build.log', 'browser-results.json']) {
            const path = `test-results/workbench/${file}`;
            if (!existsSync(path)) continue;
            const text = readFileSync(path, 'utf8').replace(/\x1b\[[0-9;]*m/g, '');
            output.push(`\n=== ${file} ===\n${text.slice(-18000)}`);
          }
          writeFileSync('.candidate/diagnostics.txt', output.join('\n') + '\n');
          NODE
          git reset --mixed --quiet "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .candidate/diagnostics.txt
          git diff --cached --quiet || git commit -m 'ci: preserve bounded candidate failure evidence'
          git push origin HEAD:refs/heads/feat/local-usage-workbench
      - name: Upload browser and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workbench-verification-evidence
          path: test-results/workbench
          if-no-files-found: ignore
          retention-days: 14
