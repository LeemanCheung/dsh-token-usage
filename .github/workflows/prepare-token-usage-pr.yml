name: Prepare token usage review fixes

on:
  push:
    branches: [feat/token-usage-high-value-insights]

permissions:
  contents: write

env:
  DSH_REF: fb82698709c39f1860b0ab0ed147e1fa30c1d5d0
  DSH_PNPM_VERSION: 11.7.0

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/token-usage-high-value-insights
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Apply reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/projection.ts')
          text = path.read_text()
          replacements = [
            ("  return fallback ?? { provider: 'unknown', model: 'unknown' }", "  return fallback ?? { provider: '', model: '' }"),
            ("      && previous.route.model === route.model\n      && bucketsEqual(previous.usage, usage)) return state", "      && previous.route.model === route.model\n      && previous.day === day\n      && bucketsEqual(previous.usage, usage)) return state"),
            ("  stateVersion: 7,", "  stateVersion: 8,"),
          ]
          for old, new in replacements:
            if old not in text: raise SystemExit(f'missing fragment: {old!r}')
            text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('src/client/TokenUsageSection.tsx')
          text = path.read_text()
          old = """function isUnattributed(model: ModelTokenUsageRecord): boolean {
            return model.provider === '' && model.model === ''
          }"""
          new = """export function isUnattributed(model: ModelTokenUsageRecord): boolean {
            return (model.provider === '' && model.model === '')
              || (model.provider === 'unknown' && model.model === 'unknown')
          }"""
          if old not in text: raise SystemExit('missing isUnattributed')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Build pinned DeepSeek Harness toolchain
        shell: bash
        run: |
          set -euo pipefail
          harness="$RUNNER_TEMP/deepseek-harness"
          git init "$harness"
          git -C "$harness" remote add origin https://github.com/deepseek-ai/deepseek-harness.git
          git -C "$harness" fetch --depth 1 origin "$DSH_REF"
          git -C "$harness" checkout --detach FETCH_HEAD
          corepack enable
          corepack prepare "pnpm@$DSH_PNPM_VERSION" --activate
          pnpm --dir "$harness" install --frozen-lockfile --ignore-scripts
          pnpm --dir "$harness" run build:lib
          node scripts/link-dsh-workspace.mjs "$harness" "$GITHUB_WORKSPACE/node_modules"
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Capture typecheck output
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck > TYPECHECK_FAILURE.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat TYPECHECK_FAILURE.log
          exit 0
      - name: Persist diagnostics
        if: steps.typecheck.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/prepare-token-usage-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TYPECHECK_FAILURE.log .github/workflows/prepare-token-usage-pr.yml
          git commit -m "chore: capture token usage typecheck failure"
          git push origin HEAD:feat/token-usage-high-value-insights
      - name: Fail after diagnostics
        if: steps.typecheck.outputs.status != '0'
        run: exit 1
      - name: Mark diagnostic success
        if: steps.typecheck.outputs.status == '0'
        run: echo "Typecheck passed"
