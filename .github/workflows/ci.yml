name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_REF: a66e4702047846cdaa10c66c9d3df3951f5ea70d
  DSH_PNPM_VERSION: 11.7.0

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out plugin branch
        uses: actions/checkout@v4

      - name: Use Node.js 22.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Build pinned DeepSeek Harness toolchain
        shell: bash
        run: |
          set -euo pipefail
          harness="$RUNNER_TEMP/deepseek-harness"
          git init "$harness"
          git -C "$harness" remote add origin https://github.com/deepseek-ai/deepseek-harness.git
          git -C "$harness" fetch --depth 1 origin "$DSH_REF"
          git -C "$harness" checkout --detach FETCH_HEAD
          corepack enable
          corepack prepare "pnpm@$DSH_PNPM_VERSION" --activate
          pnpm --dir "$harness" install --frozen-lockfile --ignore-scripts
          pnpm --dir "$harness" run build:lib
          ln -sfn "$harness" "$GITHUB_WORKSPACE/../deepseek-harness"
          node --check scripts/link-dsh-workspace.mjs
          node scripts/link-dsh-workspace.mjs "$harness" "$GITHUB_WORKSPACE/node_modules"
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          mkdir -p test-results/workbench

      - name: Typecheck host and client
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck 2>&1 | tee test-results/workbench/typecheck.log

      - name: Run regression tests
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee test-results/workbench/unit-tests.log

      - name: Browser workbench integration
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run-workbench-e2e.sh 2>&1 | tee test-results/workbench/browser.log

      - name: Rebuild committed bundles
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee test-results/workbench/build.log

      - name: Verify deterministic bundles
        shell: bash
        run: |
          set -euo pipefail
          sha256sum lib/client.js lib/client.js.map lib/index.js > test-results/workbench/bundle-sha256.txt
          npm run build
          sha256sum --check test-results/workbench/bundle-sha256.txt

      - name: Verify package contents
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          npm pack --dry-run --json --pack-destination dist > dist/pack.json
          cp dist/pack.json test-results/workbench/package-manifest.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'

          const results = JSON.parse(readFileSync('dist/pack.json', 'utf8'))
          if (!Array.isArray(results) || results.length !== 1) {
            throw new Error(`Expected one npm pack result, received ${JSON.stringify(results)}`)
          }
          const files = results[0]?.files?.map((entry) => entry.path).sort()
          if (!Array.isArray(files)) throw new Error('npm pack result did not include a files array')
          const required = [
            'LICENSE', 'README.md', 'cordis.patch.yml', 'package.json',
            'assets/token-usage-ai-analysis.png',
            'assets/token-usage-budget.png',
            'assets/token-usage-insights.png',
            'assets/token-usage-overview.png',
            'assets/token-usage-trajectory-analysis.png',
            'docs/compatibility-0.1.2-rc.1.md', 'docs/workbench.md', 'docs/workbench-acceptance.md',
            'lib/client.js', 'lib/client.js.map', 'lib/index.js',
            'src/client/index.ts', 'src/index.ts', 'src/types.ts',
            'src/workbench/host.ts', 'src/workbench/schema.ts',
            'src/client/workbench/App.tsx', 'src/client/workbench/register.tsx',
          ]
          for (const path of required) {
            if (!files.includes(path)) throw new Error(`Missing required package file: ${path}`)
          }
          const allowedExact = new Set([
            'LICENSE', 'README.md', 'cordis.patch.yml', 'package.json',
            'docs/compatibility-0.1.2-rc.1.md', 'docs/workbench.md', 'docs/workbench-acceptance.md',
          ])
          const unexpected = files.filter((path) => (
            !allowedExact.has(path)
            && !path.startsWith('assets/')
            && !path.startsWith('lib/')
            && !path.startsWith('src/')
          ))
          if (unexpected.length > 0) throw new Error(`Unexpected package files: ${unexpected.join(', ')}`)
          console.log(`Verified npm package contents (${files.length} files)`)
          NODE

      - name: Verify generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- lib

      - name: Upload workbench verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workbench-verification-evidence
          path: test-results/workbench
          if-no-files-found: ignore
          retention-days: 14
