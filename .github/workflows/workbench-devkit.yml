name: Workbench pinned development kit
on:
  push:
    branches: [feat/local-usage-workbench]
    paths: [.github/workflows/workbench-devkit.yml]
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Build pinned public toolchain
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/workbench-kit"
          mkdir -p "$root/project"
          git archive HEAD | tar -x -C "$root/project"
          git init "$root/deepseek-harness"
          git -C "$root/deepseek-harness" remote add origin https://github.com/deepseek-ai/deepseek-harness.git
          git -C "$root/deepseek-harness" fetch --depth 1 origin a66e4702047846cdaa10c66c9d3df3951f5ea70d
          git -C "$root/deepseek-harness" checkout --detach FETCH_HEAD
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm --dir "$root/deepseek-harness" install --frozen-lockfile --ignore-scripts
          pnpm --dir "$root/deepseek-harness" run build:lib
          node "$root/project/scripts/link-dsh-workspace.mjs" "$root/deepseek-harness" "$root/project/node_modules"
          # Repository credentials and version-control metadata are deliberately excluded.
          tar --exclude='.git' --exclude='.npmrc' --exclude='node_modules/.cache' -czf "$RUNNER_TEMP/workbench-kit.tar.gz" -C "$root" project deepseek-harness
      - uses: actions/upload-artifact@v4
        with:
          name: workbench-pinned-devkit
          path: ${{ runner.temp }}/workbench-kit.tar.gz
          compression-level: 0
          retention-days: 1
